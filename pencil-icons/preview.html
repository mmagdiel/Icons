<!doctype html>
<meta charset="utf-8">
<title>pencil icons</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.5 ui-sans-serif, -apple-system, system-ui, sans-serif;

  h1 { font-size: 18px; font-weight: 650; margin: 0 0 4px; }
  p.sub { margin: 0 0 28px; color: #666; }
  .grid { display: grid; gap: 20px;
           grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  figure { margin: 0; padding: 14px; background: #fff; border-radius: 10px;

  img { display: block; margin: 0 auto; }
  figcaption { margin-top: 10px; font-size: 12px; font-weight: 600; }
  figcaption small { display: block; font-weight: 400; color: #888;
                     font-size: 11px; margin-top: 2px; }
</style>
<h1>pencil icons</h1>
<p class="sub">Vector masters in <code>svg/</code> · raster previews in
